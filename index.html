<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz mit Nina</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("karte.png.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            text-align: center;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
        }

        #page1,
        #page2 {
            padding-top: 120px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
        }

        #target {
            width: 100px;
            height: 100px;
            margin: 50px auto;
            border: 3px dashed yellow;
        }

        #qr {
            display: none;
            margin-top: 30px;
        }

        #qr img {
            width: 250px;
        }
    </style>
</head>

<body>

    <!-- Seite 1 -->

    <div id="page1" class="page active">

        <h1>🔍 Find the button</h1>

        <button id="hiddenButton">
            WEITER
        </button>

    </div>

    <!-- Seite 2 -->

    <div id="page2" class="page">

        <h1>📍 Find the right place</h1>

        <p>Klicke auf das gelbe Feld zum Testen.</p>

        <div id="target"></div>

        <div id="qr">

            <h2>🎉 Congratulations!</h2>

            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://chat.whatsapp.com/BgjMkvEjQd1BSOH6ocDOpM"
                alt="QR Code">

            <p>
                <a href="https://chat.whatsapp.com/BgjMkvEjQd1BSOH6ocDOpM" target="_blank">
                    WhatsApp Gruppe öffnen
                </a>
            </p>

        </div>

    </div>

    <script>

        // Seite 1 -> Seite 2

        document.getElementById("hiddenButton").addEventListener("click", function () {

            document.getElementById("page1").classList.remove("active");
            document.getElementById("page2").classList.add("active");

        });

        // Klick auf Ziel

        document.getElementById("target").addEventListener("click", function () {

            document.getElementById("qr").style.display = "block";

        });

    </script>

</body>

</html>
