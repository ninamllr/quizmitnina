<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz mit Nina</title>

<style>

*{
    cursor:none !important;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#page1{
    padding-top:100px;
}

button{
    padding:15px 30px;
    font-size:20px;
}

#fakeCursor{
    position:fixed;
    width:20px;
    height:20px;
    border:3px solid red;
    border-radius:50%;
    pointer-events:none;
    z-index:99999;
    left:0;
    top:0;
}

</style>
</head>

<body>

<div id="fakeCursor"></div>

<div id="page1">
    <h1>🔍 Find the button</h1>

    <button id="hiddenButton">
        WEITER
    </button>
</div>

<script>

const fake = document.getElementById("fakeCursor");

document.addEventListener("mousemove", function(e){

    fake.style.left = (e.clientX + 150) + "px";
    fake.style.top = (e.clientY + 80) + "px";

});

</script>

</body>
</html>
