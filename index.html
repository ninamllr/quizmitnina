<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz mit Nina</title>

<style>

*{
    cursor:none !important;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

.page{
    display:none;
}

.active{
    display:block;
}

#page1{
    padding-top:100px;
}

#page2{
    background-image:url("karte.png.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
}

button{
    padding:15px 30px;
    font-size:20px;
}

#fakeCursor{
    position:fixed;
    width:20px;
    height:20px;
    border:3px solid red;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
}

#target{
    position:absolute;

    /* HIER SPÄTER FÜR 50A ANPASSEN */
    top:38%;
    left:32%;

    width:80px;
    height:80px;
}

#qr{
    display:none;
    margin-top:20px;
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
}

</style>
</head>

<body>

<div id="fakeCursor"></div>

<!-- Seite 1 -->
<div id="page1" class="page active">

    <h1>🔍 Find the button</h1>

    <button id="hiddenButton">
        WEITER
    </button>

</div>

<!-- Seite 2 -->
<div id="page2" class="page">

    <h1>📍 Find the right place</h1>

    <div id="target"></div>

    <div id="qr">

        <h2>🎉 Congratulations, you solved the quiz.</h2>

        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://chat.whatsapp.com/BgjMkvEjQd1BSOH6ocDOpM">

        <p>For more information scan the QR code.</p>

    </div>

</div>

<script>

const fake = document.getElementById("fakeCursor");

/* ROTEN CURSOR STARK VERSCHIEBEN */
document.addEventListener("mousemove",(e)=>{
    fake.style.left=(e.clientX+150)+"px";
    fake.style.top=(e.clientY+80)+"px";
});

/* WEITER-KNOPF */
document.getElementById("hiddenButton")
.addEventListener("click",()=>{

    document.getElementById("page1")
    .classList.remove("active");

    document.getElementById("page2")
    .classList.add("active");

});

/* KLICK AUF 50A */
document.getElementById("target")
.addEventListener("click",()=>{

    document.getElementById("qr")
    .style.display="block";

});

</script>

</body>
</html>
